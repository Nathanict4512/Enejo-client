name: 'Build Android APK (Enejo)'

on:
  push:
    branches: ['**']
  workflow_dispatch:

env:
  QT_VERSION: '6.8.3'
  QT_MODULES: 'qtremoteobjects qt5compat qtimageformats qtshadertools'
  NDK_VERSION: '27.0.11718014'
  ANDROID_MIN_SDK: '28'
  QT_MIRROR: 'https://mirrors.ocf.berkeley.edu/qt/'

jobs:
  build-android:
    name: 'Build Debug APK (arm64-v8a)'
    runs-on: ubuntu-22.04

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: 'Checkout source (with submodules)'
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # ── Java ────────────────────────────────────────────────────────────────
      - name: 'Setup Java 17'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── Android SDK + NDK ───────────────────────────────────────────────────
      - name: 'Setup Android SDK & NDK'
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-${{ env.ANDROID_MIN_SDK }}
            ndk;${{ env.NDK_VERSION }}
            build-tools;34.0.0
            cmake;3.22.1

      # ── Qt (desktop host tools + android arm64 only) ────────────────────────
      - name: 'Install desktop Qt (host tools)'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}
          extra: '--base ${{ env.QT_MIRROR }}'

      - name: 'Install android arm64-v8a Qt'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'all_os'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}
          extra: '--base ${{ env.QT_MIRROR }}'

      # ── Python + Conan ──────────────────────────────────────────────────────
      - name: 'Setup Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 'Install Conan'
        run: pip install "conan==2.28.0"

      # ── Ninja ───────────────────────────────────────────────────────────────
      - name: 'Install Ninja'
        run: sudo apt-get install -y ninja-build

      # ── ccache ──────────────────────────────────────────────────────────────
      - name: 'Setup ccache'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-arm64-debug
          max-size: 2G

      # ── Build ───────────────────────────────────────────────────────────────
      - name: 'Configure & Build (CMake direct, arm64-v8a only)'
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        shell: bash
        run: |
          set -euxo pipefail

          QT_ROOT="${QT_INSTALL_DIR}/Qt/${{ env.QT_VERSION }}"
          QT_ANDROID="${QT_ROOT}/android_arm64_v8a"
          QT_HOST="${QT_ROOT}/gcc_64"
          TOOLCHAIN="${QT_ANDROID}/lib/cmake/Qt6/qt.toolchain.cmake"
          NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}"
          BUILD_DIR="${GITHUB_WORKSPACE}/build"

          cmake -S "${GITHUB_WORKSPACE}" \
                -B "${BUILD_DIR}" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_TOOLCHAIN_FILE="${TOOLCHAIN}" \
                -DQT_HOST_PATH="${QT_HOST}" \
                -DANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}" \
                -DANDROID_NDK_ROOT="${NDK_ROOT}" \
                -DANDROID_PLATFORM="android-${{ env.ANDROID_MIN_SDK }}" \
                -DAPP_ANDROID_MIN_SDK="${{ env.ANDROID_MIN_SDK }}" \
                -DQT_ANDROID_ABIS="arm64-v8a" \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

          cmake --build "${BUILD_DIR}" --parallel 2

      # ── Collect APK ─────────────────────────────────────────────────────────
      - name: 'Collect APK'
        shell: bash
        run: |
          mkdir -p out
          echo "=== Searching for APKs ==="
          find build -name "*.apk" 2>/dev/null || true
          APK=$(find build -name "*.apk" | head -1)
          if [[ -n "$APK" ]]; then
            cp "$APK" out/Enejo_debug_arm64-v8a.apk
            echo "✅ APK: $APK"
            ls -lh out/
          else
            echo "❌ No APK found — listing build outputs:"
            find build -name "*.aab" -o -name "*.apk" 2>/dev/null || true
            exit 1
          fi

      # ── Upload ──────────────────────────────────────────────────────────────
      - name: 'Upload APK'
        uses: actions/upload-artifact@v4
        with:
          name: Enejo-debug-arm64-apk
          path: out/Enejo_debug_arm64-v8a.apk
          retention-days: 14
