name: 'Build Android APK (Enejo)'

on:
  # Run on every push to any branch
  push:
    branches:
      - '**'
  # Also allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

env:
  QT_VERSION: '6.8.3'
  QT_MODULES: 'qtremoteobjects qt5compat qtimageformats qtshadertools'
  NDK_VERSION: '27.0.11718014'
  ANDROID_MIN_SDK: 28
  ANDROID_PLATFORM: 'android-28'
  QT_MIRROR: 'https://mirrors.ocf.berkeley.edu/qt/'

jobs:
  build-android:
    name: 'Build Debug APK (arm64-v8a)'
    runs-on: ubuntu-22.04

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: 'Checkout source (with submodules)'
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # ── 2. Java ────────────────────────────────────────────────────────────
      - name: 'Setup Java 17'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Android SDK + NDK ───────────────────────────────────────────────
      - name: 'Setup Android SDK'
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;${{ env.ANDROID_PLATFORM }} ndk;${{ env.NDK_VERSION }} build-tools;34.0.0"

      # ── 4. Qt (desktop host tools + android arm64) ─────────────────────────
      - name: 'Install desktop Qt (host tools)'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}
          extra: '--base ${{ env.QT_MIRROR }}'

      - name: 'Install android arm64-v8a Qt'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'all_os'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}
          extra: '--base ${{ env.QT_MIRROR }}'

      # ── 5. Python + Conan ──────────────────────────────────────────────────
      - name: 'Setup Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 'Install Conan'
        run: pip install "conan==2.28.0"

      # ── 6. ccache ──────────────────────────────────────────────────────────
      - name: 'Setup ccache'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-arm64-debug
          max-size: 1G

      # ── 7. Build ───────────────────────────────────────────────────────────
      - name: 'Build debug APK'
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
          APP_ANDROID_MIN_SDK: ${{ env.ANDROID_MIN_SDK }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        shell: bash
        run: |
          set -euxo pipefail

          # Build using the project's own build script, targeting android, debug
          deploy/build.sh -t android

          # Collect the APK
          mkdir -p out
          find deploy/build -name "*.apk" | head -20
          cp deploy/build/client/android-build/android-build-AmneziaVPN-debug.apk \
             out/Enejo_debug_arm64-v8a.apk || \
          find deploy/build -name "*.apk" -exec cp {} out/Enejo_debug_arm64-v8a.apk \;

          echo "✅ APK built:"
          ls -lh out/

      # ── 8. Upload artifact ─────────────────────────────────────────────────
      - name: 'Upload APK artifact'
        uses: actions/upload-artifact@v4
        with:
          name: Enejo-debug-arm64-apk
          path: out/Enejo_debug_arm64-v8a.apk
          retention-days: 14
